<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Biglietto · spazio 432</title>
<meta name="theme-color" content="#f4f1ea">
<style>
  :root {
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
    --bg: #f4f1ea; --fg: #0a0a0a; --muted: #666; --accent: #993C1D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: var(--mono); color: var(--fg); min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(48px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom));
  }
  .page { width: 100%; max-width: 490px; display: flex; flex-direction: column; gap: 22px; }

  /* intestazione: come la cornice del png */
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .logo { font-size: 20px; font-weight: bold; }
  .logo span { color: var(--muted); }
  .head-tag { font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px;
    background: var(--fg); color: var(--bg); padding: 4px 8px; }


  /* ═══ BIGLIETTO · stesso linguaggio del png "programma del mese" ═══ */
  .tk { position: relative; width: 100%; max-width: 480px; padding: 0 10px 10px 0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace; color: #0a0a0a; font-size: 16px; text-align: left; }
  .tk * { box-sizing: border-box; margin: 0; padding: 0; }
  .tk-sh { position: absolute; left: 10px; top: 10px; right: 0; bottom: 0; background: #0a0a0a; }
  .tk-in { position: relative; background: #f4f1ea; border: 3px solid #0a0a0a; padding: 20px 20px 16px; }
  .tk-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-bottom: 12px; border-bottom: 5px solid #0a0a0a; }
  .tk-logo { font-size: 30px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
  .tk-logo span { color: #8a8a8a; margin-left: 3px; }
  .tk-addr { font-size: 10px; letter-spacing: 1.5px; color: #555; margin-top: 6px; }
  .tk-tag { background: #0a0a0a; color: #f4f1ea; font-size: 11px; font-weight: bold; letter-spacing: 2.5px; padding: 4px 8px; white-space: nowrap; }
  .tk-cw { position: relative; margin: 18px 6px 6px 0; }
  .tk-csh { position: absolute; left: 6px; top: 6px; right: -6px; bottom: -6px; background: #0a0a0a; }
  .tk-card { position: relative; display: flex; gap: 14px; align-items: center; border: 3px solid #0a0a0a; padding: 14px; color: #fff; background: #534AB7; }
  .tk-date { flex: 0 0 auto; width: 66px; background: #fff; border: 3px solid #0a0a0a; text-align: center; padding: 6px 0 7px; color: #0a0a0a; }
  .tk-dow, .tk-mon { font-size: 11px; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; }
  .tk-day { font-size: 32px; font-weight: 900; line-height: 1.05; letter-spacing: -1px; }
  .tk-info { min-width: 0; flex: 1; }
  .tk-cat { font-size: 11px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; opacity: .9; overflow-wrap: anywhere; }
  .tk-name { font-size: 24px; font-weight: 900; line-height: 1.08; letter-spacing: -.5px; margin-top: 4px; overflow-wrap: anywhere; }
  .tk-pills { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tk-pill { font-size: 12px; font-weight: bold; border: 2px solid #fff; border-radius: 20px; padding: 1px 9px; white-space: nowrap; }
  .tk-pill:empty { display: none; }
  .tk-mid { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; margin-top: 18px; }
  .tk-who { min-width: 0; flex: 1; }
  .tk-lbl { font-size: 10px; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; color: #555; }
  .tk-holder { font-size: 18px; font-weight: 900; margin: 2px 0 10px; overflow-wrap: anywhere; }
  .tk-email { font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
  .tk-qr { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .tk .qr-box { width: 104px; height: 104px; background: #fff; border: 3px solid #0a0a0a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .tk .qr-box canvas { display: block; width: 92px !important; height: 92px !important; }
  .tk-qr-lbl { font-size: 9px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; text-align: center; color: #555; line-height: 1.4; }
  .tk-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; padding-top: 12px; border-top: 5px solid #0a0a0a; }
  .tk-code { font-size: 22px; font-weight: 900; letter-spacing: 3px; margin-top: 2px; white-space: nowrap; }

  /* logo al posto della scritta */
  .tk-brand { display: flex; align-items: flex-end; gap: 12px; }
  .tk-logo-img { height: 76px; width: auto; display: block; }
  .tk-where { font-size: 15px; font-weight: 900; margin: 2px 0 10px; }
  #t-email-wrap[hidden] { display: none; }
  @media (max-width: 420px) { .tk-logo-img { height: 64px; } }
  .tk-dia { display: flex; align-items: center; gap: 10px; }
  .tk-bubble { position: relative; background: #fff; border: 2px solid #0a0a0a; font-size: 12px; font-weight: 900; padding: 6px 9px; box-shadow: 3px 3px 0 #0a0a0a; white-space: nowrap; }
  .tk-bubble::after { content: ''; position: absolute; right: -9px; top: 50%; margin-top: -6px; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 8px solid #0a0a0a; }
  .tk-dia-svg { width: 40px; height: 53px; display: block; }
  @media (max-width: 420px) {
    .tk-in { padding: 16px 14px 14px; }
    .tk-logo { font-size: 25px; }
    .tk-card { padding: 12px; gap: 12px; }
    .tk-date { width: 58px; }
    .tk-day { font-size: 27px; }
    .tk-name { font-size: 20px; }
    .tk .qr-box { width: 96px; height: 96px; }
    .tk .qr-box canvas { width: 84px !important; height: 84px !important; }
    .tk-code { font-size: 18px; letter-spacing: 2px; }
    .tk-bubble { display: none; }
  }

  /* azioni */
  .actions { display: flex; gap: 12px; }
  .btn {
    font-family: var(--mono); font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: .8px;
    min-height: 48px; padding: 0 18px; cursor: pointer; border: 2px solid var(--fg);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: transform .1s, box-shadow .1s, background .15s, color .15s;
  }
  .btn.primary { flex: 1; background: var(--fg); color: var(--bg); box-shadow: 4px 4px 0 var(--accent); }
  .btn.primary:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--accent); }
  .btn.primary:disabled { opacity: .7; cursor: progress; }
  .btn.ghost { background: transparent; color: var(--fg); }
  @media (hover: hover) {
    .btn.primary:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--accent); }
    .btn.ghost:hover { background: var(--fg); color: var(--bg); }
  }
  .hint { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.5; }
  .foot { font-size: 10px; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: 1px; }
  .foot a { color: inherit; }

  @media (max-width: 420px) {
    .ticket-body { padding: 18px 16px 14px; gap: 12px; }
    .ticket-name { font-size: 17px; }
  }

  @media print {
    @page { size: A4 portrait; margin: 16mm; }
    body { padding: 0; justify-content: flex-start; background: #fff; }
    .actions, .hint, .foot { display: none !important; }
    .page { max-width: 170mm; }
  }
</style>
</head>

<script>
const T_CAT_COLORS = { music: '#534AB7', film: '#993C1D', lab: '#3B6D11', art: '#854F0B', meet: '#4B5563' };
const T_CAT_LABELS = { music: 'Musica', film: 'Cineforum', lab: 'Laboratorio', art: 'Arte', meet: 'Riunioni' };
// riempie il biglietto (stesso disegno nel sito, nell'admin, nella pagina biglietto e nell'immagine)
const TK_MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const TK_DOW = ['dom','lun','mar','mer','gio','ven','sab'];
function fillTicket(t) {
  const color = T_CAT_COLORS[t.cat] || '#534AB7';
  document.getElementById('tk-card').style.background = color;
  const m = String(t.date || '').match(/(\d{1,2})\s+(\S+)\s+(\d{4})/);
  let dow = '', day = '', mon = '';
  if (m) {
    const mi = TK_MESI.indexOf(m[2].toLowerCase());
    day = m[1];
    mon = (mi >= 0 ? TK_MESI[mi] : m[2]).slice(0, 3) + ' ' + m[3].slice(2);
    if (mi >= 0) dow = TK_DOW[new Date(+m[3], mi, +m[1]).getDay()];
  }
  document.getElementById('t-dow').textContent = dow;
  document.getElementById('t-day').textContent = day;
  document.getElementById('t-day').style.color = color;
  document.getElementById('t-mon').textContent = mon;
  document.getElementById('t-cat').textContent = (T_CAT_LABELS[t.cat] || t.cat || '') + (t.rassegna ? ' · ' + t.rassegna : '');
  document.getElementById('t-name').textContent = t.event;
  document.getElementById('t-time').textContent = t.time || '';
  document.getElementById('t-seats').textContent = t.seats + (String(t.seats) === '1' ? ' posto' : ' posti');
  document.getElementById('t-holder').textContent = t.name;
  document.getElementById('t-email').textContent = t.email || '';
  document.getElementById('t-email-wrap').hidden = !t.email;   // la mail è facoltativa
  document.getElementById('t-code').textContent = t.code;
}
let _ticket = null;

// QR su canvas (UTF-8, dimensione automatica), come nel sito
function drawQR(box, text, px) {
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  const qr = qrcode(0, 'M');
  qr.addData(text, 'Byte');
  qr.make();
  const n = qr.getModuleCount(), quiet = 2;
  const scale = Math.max(2, Math.ceil(px * 3 / (n + quiet * 2)));
  const size = (n + quiet * 2) * scale;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#0a0a0a';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++)
    if (qr.isDark(r, k)) ctx.fillRect((k + quiet) * scale, (r + quiet) * scale, scale, scale);
  c.style.width = c.style.height = px + 'px';
  c.setAttribute('role', 'img'); c.setAttribute('aria-label', 'codice QR del biglietto');
  box.innerHTML = '';
  box.appendChild(c);
}

// codice leggibile per i biglietti vecchi, senza codice univoco
function legacyCode(name, event, date) {
  const str = name + event + date;
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  return 'S432-' + Math.abs(h).toString(16).toUpperCase().padStart(4, '0').slice(0, 4);
}

function showTicket(d) {
  const t = {
    name: d.name || 'Mario Rossi', email: d.name ? (d.email || '') : 'mario@email.it',
    event: d.event || 'Concerto di Primavera', cat: d.cat || 'music',
    date: d.date || '14 Giugno 2026', time: d.time || '21:00',
    seats: String(d.seats || '1'), codice: d.codice || null, rassegna: d.rassegna || null
  };
  t.code = t.codice ? 'S432-' + t.codice.slice(0, 4).toUpperCase() : legacyCode(t.name, t.event, t.date);
  _ticket = t;
  fillTicket(t);
  const qrData = t.codice
    ? `SPAZIO432|${t.codice}|${String(t.name).slice(0, 40)}`
    : `SPAZIO432|${t.code}|${t.name}|${t.event}|${t.date} ${t.time}|posti:${t.seats}`;
  drawQR(document.getElementById('qr-box'), qrData, 80);
  document.title = `Biglietto · ${t.event} · spazio 432`;
}

// nome file sempre diverso: evento, data, intestatario e codice
function ticketFileName(t) {
  const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32);
  return ['biglietto-spazio432', slug(t.event), slug(t.date), slug(t.name), slug(t.code)].filter(Boolean).join('_') + '.png';
}

async function saveTicketImage() {
  if (!_ticket) return;
  const btn = document.getElementById('t-act-img');
  const reset = ms => setTimeout(() => { btn.textContent = '↓ salva biglietto'; btn.disabled = false; }, ms);
  btn.textContent = 'preparo…'; btn.disabled = true;
  try {
    const canvas = await html2canvas(document.getElementById('ticket'), { scale: 3, useCORS: true, backgroundColor: '#f4f1ea', logging: false });
    const pad = 48, out = document.createElement('canvas');
    out.width = canvas.width + pad * 2; out.height = canvas.height + pad * 2;
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#f4f1ea'; ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(canvas, pad, pad);
    const blob = await new Promise(res => out.toBlob(res, 'image/png'));
    const name = ticketFileName(_ticket);
    const file = new File([blob], name, { type: 'image/png' });
    const touch = window.matchMedia('(pointer: coarse)').matches;
    if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Biglietto spazio 432' }); btn.textContent = '✓ fatto'; reset(1800); return; }
      catch (err) { if (err && err.name === 'AbortError') { reset(0); return; } }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    btn.textContent = '✓ salvato'; reset(1800);
  } catch (e) {
    console.error(e);
    btn.textContent = 'errore, riprova'; reset(2200);
  }
}

// dati del biglietto: passati dal sito (localStorage), altrimenti esempio
(function () {
  let data = {};
  try {
    const raw = localStorage.getItem('s432_ticket');
    if (raw) { data = JSON.parse(raw) || {}; localStorage.removeItem('s432_ticket'); }
  } catch (e) {}
  showTicket(data);
})();
</script>
