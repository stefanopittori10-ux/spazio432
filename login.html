<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<script>
// l'area staff vive su staff.spazio432.org: così su Android è un'app separata da quella pubblica
(function () { var h = location.hostname; if (h === 'spazio432.org' || h === 'www.spazio432.org') location.replace('https://staff.spazio432.org' + location.pathname + location.search + location.hash); })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/staff-favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/staff-favicon-32.png">
<link rel="apple-touch-icon" href="/staff-apple-touch-icon.png">
<title>spazio 432</title>
<link rel="manifest" href="/manifest-staff.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="staff432">
<meta name="theme-color" content="#ffffff">

<style>
  :root {
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
    --bg: #fff; --fg: #0a0a0a; --muted: #666;
    --border: #0a0a0a; --border-light: #e5e5e5;
    --music: #534AB7; --green: #3B6D11;
    --error: #993C1D; --error-bg: #FAECE7;
  }
  /* tema giallo cantiere: solo gli sfondi cambiano, tasti e campi restano com'erano */
  [data-theme="giallo"] { --bg: #FFCC00; --muted: #4a3d00; --border-light: rgba(0,0,0,.12); }
  [data-theme="giallo"] input { background: #fff; }
  [data-theme="giallo"] .login-btn { color: #fff; }
  [data-theme="dark"] {
    --bg: #111; --fg: #e8e8e8; --muted: #888;
    --border: #444; --border-light: #2a2a2a; --error-bg: #2a1a16;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--mono); background: var(--bg); color: var(--fg);
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px; transition: background .25s, color .25s;
  }
  .login-wrap { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 28px; }

  /* Logo */
  .logo { display: flex; flex-direction: column; gap: 4px; }
  .logo-main { font-size: 28px; font-weight: bold; letter-spacing: -0.5px; }
  .logo-main span { color: var(--muted); }
  .logo-sub { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }

  /* Tabs */
  .tabs { display: flex; gap: 0; border: 1px solid var(--border); }
  .tab {
    flex: 1; padding: 9px; font-family: var(--mono); font-size: 10px;
    font-weight: bold; text-transform: uppercase; letter-spacing: 0.8px;
    background: transparent; color: var(--muted); border: none; cursor: pointer;
    transition: all .15s;
  }
  .tab.active { background: var(--fg); color: var(--bg); }
  .tab:not(.active):hover { background: var(--border-light); color: var(--fg); }

  /* Pannelli */
  .panel { display: none; flex-direction: column; gap: 12px; }
  .panel.active { display: flex; }

  /* Form */
  .form-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 3px; display: block; }
  .form-input {
    width: 100%; font-family: var(--mono);    font-size: 16px;
    padding: 10px 14px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); outline: none;
    transition: border-color .15s;
  }
  .form-input:focus { border-color: var(--music); }
  .form-input.err { border-color: var(--error) !important; }
  .login-btn {
    font-family: var(--mono); font-size: 12px; font-weight: bold;
    text-transform: uppercase; letter-spacing: 0.8px; padding: 12px;
    background: var(--fg); color: var(--bg); border: 1px solid var(--border);
    cursor: pointer; transition: opacity .15s; width: 100%;
  }
  .login-btn:hover { opacity: .8; }
  .error-msg {
    font-size: 11px; color: var(--error); padding: 8px 12px;
    background: var(--error-bg); border: 1px solid var(--error); display: none;
  }
  .error-msg.visible { display: block; }

  /* Sezioni post-login */
  .sections { display: none; flex-direction: column; gap: 10px; }
  .sections.visible { display: flex; }
  .section-title { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 4px; }
  .section-card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border: 1px solid var(--border-light);
    text-decoration: none; color: var(--fg); transition: all .15s; cursor: pointer;
  }
  .section-card:hover { border-color: var(--border); background: var(--border-light); }
  .section-card-left { display: flex; flex-direction: column; gap: 3px; }
  .section-card-name { font-size: 14px; font-weight: bold; }
  .section-card-desc { font-size: 11px; color: var(--muted); }
  .section-card-arrow { font-size: 16px; color: var(--muted); }
  .section-card.calendar { border-left: 4px solid var(--music); }
  .section-card.scanner-card { border-left: 4px solid #854F0B; cursor: pointer; user-select: none; }
  .section-card.scanner-card.open { background: var(--border-light); }
  .section-card.finance  { border-left: 4px solid var(--green); }
  .logout-row { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--muted); }
  .logout-btn { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; transition: color .15s; }
  .logout-btn:hover { color: var(--fg); }

  /* Scanner QR */
  .scanner-wrap {
    position: relative; background: #000; overflow: hidden;
    border: 1px solid var(--border);
    aspect-ratio: 1; width: 100%;
  }
  #qr-video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scanner-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .scanner-frame {
    width: 52%; aspect-ratio: 1; border: 2px solid rgba(255,255,255,0.55); position: relative;
    transition: border-color .2s, box-shadow .2s;
  }
  .scanner-frame.ok   { border-color: #4ade80; box-shadow: 0 0 20px rgba(74,222,128,.35); }
  .scanner-frame.fail { border-color: #f87171; box-shadow: 0 0 20px rgba(248,113,113,.35); }
  .scanner-frame::before, .scanner-frame::after,
  .scanner-frame > span::before, .scanner-frame > span::after {
    content:''; position:absolute; width:14px; height:14px; border-color:inherit; border-style:solid;
  }
  .scanner-frame::before  { top:-2px; left:-2px;   border-width:2px 0 0 2px; }
  .scanner-frame::after   { top:-2px; right:-2px;  border-width:2px 2px 0 0; }
  .scanner-frame > span::before { bottom:-2px; left:-2px;  border-width:0 0 2px 2px; }
  .scanner-frame > span::after  { bottom:-2px; right:-2px; border-width:0 2px 2px 0; }
  .scan-line {
    position: absolute; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
    animation: scanline 2s linear infinite;
  }
  @keyframes scanline { 0%{top:0} 100%{top:100%} }
  .scanner-status {
    position: absolute; bottom:10px; left:0; right:0;
    text-align: center; font-size: 10px;
    color: rgba(255,255,255,.6); text-transform: uppercase; letter-spacing: 1px;
  }
  .scanner-start {
    position: absolute; inset:0; background: rgba(0,0,0,.85);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; cursor: pointer;
  }
  .scanner-start.hidden { display: none; }
  .scanner-start-icon { font-size: 36px; }
  .scanner-start-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #fff; text-align: center; line-height: 1.6; }

  /* Risultato scanner */
  .scan-result {
    border: 1px solid var(--border-light); padding: 14px; display: none;
    animation: slideup .2s ease;
  }
  .scan-result.visible { display: block; }
  .scan-result.ok   { background: #EAF3DE; border-color: var(--green); color: #27500A; }
  .scan-result.fail { background: var(--error-bg); border-color: var(--error); color: #712B13; }
  [data-theme="dark"] .scan-result.ok   { background: #0d1f08; color: #86efac; }
  [data-theme="dark"] .scan-result.fail { background: #1f0a08; color: #fca5a5; }
  @keyframes slideup { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .scan-result-status { font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .scan-result-name   { font-size: 17px; font-weight: bold; margin-bottom: 3px; }
  .scan-result-event  { font-size: 11px; opacity: .75; margin-bottom: 8px; }
  .scan-result-meta   { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; border-top: 1px solid currentColor; padding-top: 7px; opacity: .75; }
  .scan-result-meta-item { font-size: 9px; }
  .scan-result-meta-item strong { display: block; font-size: 11px; font-weight: bold; }

  /* Theme toggle */
  .theme-toggle {
    position: fixed; top: 16px; right: 16px;
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--border-light); background: var(--bg); color: var(--fg);
    cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .footer-note { font-size: 10px; color: var(--muted); text-align: center; letter-spacing: 1px; }
  .site-link { color: inherit; text-decoration: underline; text-underline-offset: 3px; font-weight: bold; }
  .site-link:hover { text-decoration-thickness: 2px; }

  /* Dashboard prenotazioni */
  .mgmt-tabs {
    display: flex;
    border-bottom: 1px solid var(--border-light);
    margin-bottom: 12px;
  }
  .mgmt-tab {
    flex: 1; padding: 9px 8px;
    font-family: var(--mono); font-size: 10px; font-weight: bold;
    text-transform: uppercase; letter-spacing: 0.8px;
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .mgmt-tab.active { color: var(--fg); border-bottom-color: var(--fg); }

  /* Lista prenotazioni */
  .bk-filter-row {
    display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .bk-filter-sel {
    flex: 1; min-width: 0;
    font-family: var(--mono); font-size: 11px;
    padding: 7px 10px;
    border: 1px solid var(--border-light);
    background: var(--bg); color: var(--fg);
    outline: none;
  }
  .bk-refresh-btn {
    font-family: var(--mono); font-size: 11px; font-weight: bold;
    padding: 7px 12px;
    border: 1px solid var(--border-light);
    background: none; color: var(--fg); cursor: pointer;
    transition: all .15s; flex-shrink: 0;
  }
  .bk-refresh-btn:hover { background: var(--fg); color: var(--bg); }

  .bk-list { display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow-y: auto; }
  .bk-item {
    padding: 10px 12px;
    border: 1px solid var(--border-light);
    display: flex; flex-direction: column; gap: 2px;
    position: relative;
  }
  .bk-item-name  { font-size: 13px; font-weight: bold; color: var(--fg); }
  .bk-item-event { font-size: 11px; color: var(--muted); }
  .bk-item-meta  { font-size: 10px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  .bk-item-seats {
    position: absolute; top: 10px; right: 12px;
    font-size: 11px; font-weight: bold;
    background: var(--border-light); color: var(--fg);
    padding: 2px 8px; border-radius: 10px;
  }
  .bk-empty { font-size: 11px; color: var(--muted); padding: 16px 0; text-align: center; }
  .bk-stats {
    display: flex; gap: 8px; margin-bottom: 10px;
  }
  .bk-stat {
    flex: 1; padding: 10px; border: 1px solid var(--border-light);
    display: flex; flex-direction: column; gap: 2px; align-items: center;
  }
  .bk-stat-num  { font-size: 22px; font-weight: bold; color: var(--fg); }
  .bk-stat-label{ font-size: 9px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }

  .bk-item { cursor: default; transition: background .15s; }
  .bk-item.checked-in { background: #EAF3DE; border-color: #3B6D11; }
  [data-theme="dark"] .bk-item.checked-in { background: #0d1f08; border-color: #3B6D11; }

  .bk-checkin {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--border-light);
  }
  .bk-checkin-box {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: all .15s; background: var(--bg);
  }
  .bk-checkin-box.checked {
    background: #3B6D11; border-color: #3B6D11; color: #fff;
  }
  .bk-checkin-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--muted); cursor: pointer; user-select: none;
  }
  .bk-checkin-box.checked + .bk-checkin-label { color: #3B6D11; font-weight: bold; }
  .bk-checkin-time { font-size: 9px; color: var(--muted); margin-left: auto; }

  /* Counter check-in nei stats */
  .bk-stat.checkin-stat .bk-stat-num { color: #3B6D11; }

  /* ── icona tema: luna/sole pieni e spessi ── */
  .th-ico { width: 18px; height: 18px; display: block; }
  /* il tasto mostra il tema successivo: chiaro → giallo (ciambella) → scuro (luna) → chiaro (sole) */
  .th-sun, .th-moon { display: none; }
  [data-theme="giallo"] .th-donut { display: none; } [data-theme="giallo"] .th-moon { display: inline; }
  [data-theme="dark"] .th-donut { display: none; } [data-theme="dark"] .th-sun { display: inline; }

  /* ═══ BOTTONI COME LA HOME DEL SITO ═══════════════════════ */
  .login-wrap { max-width: 440px; }
  .sections { gap: 18px; }
  .section-title { margin-bottom: 0; }
  .hub-btn {
    position: relative; display: flex; flex-direction: column; gap: 10px;
    padding: 18px 20px 20px; text-decoration: none; color: #fff; cursor: pointer; user-select: none;
    border: 2px solid var(--fg); box-shadow: 6px 6px 0 var(--fg);
    transition: transform .12s ease, box-shadow .12s ease;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .hub-btn.cal  { background: #534AB7; }
  .hub-btn.fin  { background: #3B6D11; }
  .hub-btn.pren { background: #854F0B; }
  @media (hover: hover) {
    .hub-btn:hover { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--fg); }
    .hub-btn:hover .hb-arrow { transform: translateX(5px); }
  }
  .hub-btn:active, .hub-btn.pressed { transform: translate(6px, 6px); box-shadow: 0 0 0 var(--fg); }
  .hub-btn.pren.open { transform: translate(6px, 6px); box-shadow: 0 0 0 var(--fg); }
  .hub-btn.pren.open .hb-arrow { transform: none; }
  .hb-top { display: flex; justify-content: space-between; align-items: center; }
  .hb-kicker { font-size: 10px; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; opacity: .85; }
  .hb-arrow { font-size: 24px; font-weight: bold; line-height: .8; transition: transform .15s; }
  .hb-title { font-size: 34px; font-weight: 900; letter-spacing: -1px; line-height: .95; }
  .hb-sub { font-size: 11px; opacity: .9; }
  #scanner-panel { margin-top: -4px; }

  /* bottone "entra" e tema nello stesso stile */
  .login-btn { border-width: 2px; box-shadow: 4px 4px 0 #993C1D; transition: transform .1s, box-shadow .1s; }
  .login-btn:hover { opacity: 1; transform: translate(-1px, -1px); box-shadow: 5px 5px 0 #993C1D; }
  .login-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #993C1D; }
  .theme-toggle { width: 36px; height: 36px; border: 1px solid var(--fg); }
  .theme-toggle:hover { background: var(--fg); color: var(--bg); }
  @media (max-width: 400px) { .hb-title { font-size: 30px; } }

  /* anteprima prenotati nel blocco PRENOTAZIONI */
  .hb-next { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .hb-next:empty { display: none; }
  .hb-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; font-size: 12px;
    border-top: 1px solid rgba(255,255,255,.35); padding-top: 5px; }
  .hb-d { font-weight: bold; white-space: nowrap; }
  .hb-e { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hb-c { font-weight: 900; white-space: nowrap; background: #fff; color: #854F0B; padding: 1px 7px; }
</style>
</head>

<div class="login-wrap">

  <div class="logo">
    <div class="logo-main">spazio<span>432</span></div>
    <div class="logo-sub">area riservata</div>
  </div>

  <!-- FORM LOGIN -->
  <div id="login-section">
    <div class="panel active" id="panel-login">
      <div>
        <label class="form-label" for="email-input">nome</label>
        <input class="form-input" id="email-input" type="text"
          placeholder="es. michela" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"
          onkeydown="if(event.key==='Enter') document.getElementById('pwd-input').focus()">
      </div>
      <div>
        <label class="form-label" for="pwd-input">password</label>
        <input class="form-input" id="pwd-input" type="password"
          placeholder="········" autocomplete="current-password"
          onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <div class="error-msg" id="error-msg">nome o password errati</div>
      <button class="login-btn" id="login-btn" onclick="doLogin()">entra →</button>
    </div>
  </div>

  <!-- SEZIONI POST-LOGIN -->
  <div class="sections" id="sections">
    <div class="section-title">dove vuoi andare?</div>

    <a class="hub-btn cal" href="admin.html">
      <div class="hb-top"><span class="hb-kicker">01 / eventi</span><span class="hb-arrow">→</span></div>
      <div class="hb-title">CALENDARIO</div>
      <div class="hb-sub">gestione eventi e prenotazioni</div>
    </a>

    <a class="hub-btn fin" href="finanze.html">
      <div class="hb-top"><span class="hb-kicker">02 / conti</span><span class="hb-arrow">→</span></div>
      <div class="hb-title">FINANZE</div>
      <div class="hb-sub">entrate, uscite e rendiconto</div>
    </a>

    <!-- Gestione prenotazioni — blocco + pannello collassabile -->
    <a class="hub-btn pren" href="prenotazioni.html" id="scanner-card">
      <div class="hb-top"><span class="hb-kicker">03 / ingresso</span><span class="hb-arrow" id="scanner-arrow">→</span></div>
      <div class="hb-title">PRENOTAZIONI</div>
      <div class="hb-sub">scanner QR e lista prenotati</div>
      <div class="hb-next" id="hb-next"></div>
    </a>

    <div class="logout-row">
      <a class="site-link" href="https://spazio432.org/">spazio432.org ↗</a>
      <button class="logout-btn" onclick="doLogout()">esci</button>
    </div>
  </div>

  <div class="footer-note">via ceva 47 · torino</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


// ── CONFIG ────────────────────────────────────────────────────
// Un solo progetto Supabase per tutto (eventi, prenotazioni, finanze): un utente per membro.
// Le chiavi publishable sono pubbliche per natura: a proteggere i dati sono le policy RLS.
const _supabase = supabase.createClient("https://udaymqqytagtayviwolr.supabase.co", "sb_publishable_nFiO-dUTfrElolGJuJXbFQ_fjKbEAxs");
try { localStorage.removeItem('sb-rsgazxwkdyphdjogvbpe-auth-token'); } catch {}   // sessione del vecchio progetto finanze
try { sessionStorage.removeItem('s432_auth'); } catch {}   // residuo del vecchio login

// ── LOGIN ─────────────────────────────────────────────────────
function loginError(msg) {
  const err = document.getElementById('error-msg');
  err.textContent = msg; err.classList.add('visible');
  document.getElementById('pwd-input').classList.add('err');
  if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
}

async function doLogin() {
  const emailEl = document.getElementById('email-input');
  const pwdEl   = document.getElementById('pwd-input');
  const btn     = document.getElementById('login-btn');
  const err     = document.getElementById('error-msg');
  const user = emailEl.value.trim().toLowerCase(), password = pwdEl.value;
  // basta il nome: "michela" diventa michela@spazio432.org (una mail completa funziona lo stesso)
  const email = !user ? '' : user.includes('@') ? user : user.replace(/\s+/g, '') + '@spazio432.org';
  pwdEl.classList.remove('err'); err.classList.remove('visible');
  if (!email || !password) { loginError('inserisci nome e password'); return; }

  btn.disabled = true; btn.textContent = 'verifico…';
  const cal = await _supabase.auth.signInWithPassword({ email, password });
  if (cal.error) {
    btn.disabled = false; btn.textContent = 'entra →';
    pwdEl.value = ''; pwdEl.focus();
    loginError(/invalid/i.test(cal.error.message) ? 'nome o password errati' : 'errore: ' + cal.error.message);
    return;
  }
  btn.disabled = false; btn.textContent = 'entra →';
  pwdEl.value = '';
  showSections();
}

async function doLogout() {
  await _supabase.auth.signOut();
  document.getElementById('sections').classList.remove('visible');
  document.getElementById('login-section').style.display = '';
  document.getElementById('pwd-input').value = '';
  document.getElementById('email-input').focus();
}

function showSections() {
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('sections').classList.add('visible');
  loadBookingPreview();
}

// sessione già aperta (dura finché non premi "esci")
(async () => {
  const { data } = await _supabase.auth.getSession();
  if (data.session) showSections();
  else setTimeout(() => document.getElementById('email-input').focus(), 100);
})();

// ── BOTTONI: effetto pressione prima di cambiare pagina ──────
document.querySelectorAll('a.hub-btn').forEach(b => b.addEventListener('click', e => {
  e.preventDefault();
  if (b.classList.contains('pressed')) return;
  b.classList.add('pressed');
  setTimeout(() => { location.href = b.getAttribute('href'); }, 140);
}));
// anteprima prenotati: i prossimi eventi con prenotazioni, dal più vicino
async function loadBookingPreview() {
  const box = document.getElementById('hb-next');
  if (!box) return;
  try {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const { data: evs } = await _supabase.from('events').select('id, name, day, month, year, time').gte('year', today.getFullYear());
    const fut = (evs || []).filter(e => new Date(e.year, e.month, e.day) >= today)
      .sort((a, b) => new Date(a.year, a.month, a.day) - new Date(b.year, b.month, b.day) || String(a.time || '').localeCompare(String(b.time || '')));
    if (!fut.length) { box.innerHTML = '<div class="hb-row">nessun evento in arrivo</div>'; return; }
    const { data: bks } = await _supabase.from('bookings').select('event_id, seats, checked_in').in('event_id', fut.map(e => e.id)).is('annullata_il', null);
    const rows = fut.map(e => {
      const l = (bks || []).filter(b => String(b.event_id) === String(e.id));
      return { e, n: l.length, s: l.reduce((a, b) => a + (parseInt(b.seats) || 1), 0) };
    }).filter(r => r.n).slice(0, 3);
    const DW = ['dom','lun','mar','mer','gio','ven','sab'];
    const esc = x => String(x ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    box.innerHTML = rows.length
      ? rows.map(r => `<div class="hb-row"><span class="hb-d">${DW[new Date(r.e.year, r.e.month, r.e.day).getDay()]} ${r.e.day}</span><span class="hb-e">${esc(r.e.name)}</span><span class="hb-c">${r.s} ${r.s === 1 ? 'posto' : 'posti'}</span></div>`).join('')
      : '<div class="hb-row">ancora nessun prenotato per i prossimi eventi</div>';
  } catch { box.innerHTML = ''; }
}
window.addEventListener('pageshow', () => document.querySelectorAll('.hub-btn.pressed').forEach(b => b.classList.remove('pressed')));

// ── TEMA ─────────────────────────────────────────────────────
// tre temi: chiaro → giallo → scuro → chiaro (la scelta vale per tutte le pagine dello staff)
const TEMA_COLORE = { light: '#ffffff', giallo: '#FFCC00', dark: '#111111' };
function applicaTema(t) {
  document.documentElement.dataset.theme = t === 'light' ? '' : t;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = TEMA_COLORE[t] || '#ffffff';
}
function toggleTheme() {
  const ora = document.documentElement.dataset.theme || 'light';
  const dopo = ora === 'light' ? 'giallo' : ora === 'giallo' ? 'dark' : 'light';
  applicaTema(dopo);
  localStorage.setItem('s432-theme', dopo);   // stessa chiave di admin, ingresso e finanze
}
const t = localStorage.getItem('s432-theme') || localStorage.getItem('s432_theme');
if (t === 'dark' || t === 'giallo') applicaTema(t);
</script>
<script>
// installabile come app "staff432" (stesso service worker del sito: nessuna cache)
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
